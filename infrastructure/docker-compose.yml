services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: factory
      POSTGRES_DB: engineering_factory
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - factory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory -d engineering_factory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  factory-postgres:
